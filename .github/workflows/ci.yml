name: CI

on:
  pull_request:
    branches: [develop-fe, main]
  push:
    branches: [develop-fe, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: frontend

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}

jobs:
  check:
    name: lint · format · tsc · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npx tsc -b
      - run: npm run coverage
      - name: build (경고 검사)
        run: |
          npx vite build 2>&1 | tee build.log
          if grep -qE "didn't resolve|doesn't exist" build.log; then echo "::error::unresolved asset in build"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-head
          path: frontend/dist
          retention-days: 7

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    needs: check
    env:
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chrome   # playwright.config.ts가 channel:'chrome'(시스템 Chrome)을 쓰므로 Chrome stable 설치
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  perf:
    name: perf (Lighthouse base vs head)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: build head
        run: |
          npm ci
          npx vite build
      - name: build base
        working-directory: base/frontend
        run: |
          npm ci
          npx vite build
      - name: measure head (3 runs × 5 pages)
        run: |
          (npx vite preview --port 4173 --strictPort > /tmp/head.log 2>&1 &)
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:4173/portfolio && break || sleep 1; done
          npm run perf -- head 3 \
            http://localhost:4173/portfolio http://localhost:4173/post http://localhost:4173/post/97 \
            http://localhost:4173/project http://localhost:4173/project/11 > /tmp/head.md
          pkill -f "vite preview --port 4173" || true
      - name: measure base
        working-directory: base/frontend
        run: |
          (npx vite preview --port 4174 --strictPort > /tmp/base.log 2>&1 &)
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:4174/portfolio && break || sleep 1; done
          # base 브랜치에 perf 스크립트가 없을 수 있으므로 head의 스크립트를 사용
          OUT=$GITHUB_WORKSPACE/frontend/scripts/perf/results bash $GITHUB_WORKSPACE/frontend/scripts/perf/measure.sh base 3 \
            http://localhost:4174/portfolio http://localhost:4174/post http://localhost:4174/post/97 \
            http://localhost:4174/project http://localhost:4174/project/11 > /tmp/base.md
          pkill -f "vite preview --port 4174" || true
      - name: compare + budget
        id: compare
        run: |
          {
            echo '## 📊 perf (mobile simulated, 3-run median) — base `${{ github.base_ref }}` → head'
            echo
            node scripts/perf/compare.mjs scripts/perf/results/base scripts/perf/results/head scripts/perf/budget.json || echo "BUDGET_FAIL=1" >> $GITHUB_ENV
            echo
            echo '### head 상세'
            cat /tmp/head.md
            echo
            echo '### 번들 (gzip)'
            node scripts/perf/bundle-size.mjs ../base/frontend/dist dist
          } > /tmp/comment.md
          cat /tmp/comment.md
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: perf-report
          path: /tmp/comment.md
      - name: fail on budget
        if: env.BUDGET_FAIL == '1'
        run: echo "::error::performance budget exceeded (see PR comment)" && exit 1
